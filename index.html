<style>
@font-face{font-family:Vazirmatn;src:url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:light;--paper:#f4f0e8;--panel:#f8f5ef;--white:#fffdf9;--ink:#25221e;--sub:#736d63;--muted:#7f776c;--line:#ded7cb;--red:#bf3c2c;--green:#335d4f;--yellow:#edd093;--wash:#ebe4d8;--shadow:0 14px 40px #3026150c;--tap:44px;--r:8px}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 Vazirmatn,Tahoma,sans-serif;padding-bottom:116px;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.5}a{color:inherit;text-decoration:none}svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sprite{position:absolute;width:0;height:0;overflow:hidden}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:3px}button,input,select{touch-action:manipulation}[hidden]{display:none!important}
.btn,.icon-btn,.text-btn{height:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;border-radius:var(--r);font-size:13px;font-weight:650;line-height:1.3;transition:background .15s;color:var(--ink);background:transparent}
.btn{padding:0 16px;border:1px solid var(--line);white-space:nowrap;background:var(--white)}.icon-btn{width:var(--tap);min-width:var(--tap);padding:0}.text-btn{padding:0 8px;color:var(--red)}.btn:hover,.icon-btn:hover{background:var(--wash)}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}[data-theme=dark] .btn.primary{color:#29150e}.btn.active,.icon-btn.active{color:var(--red);background:var(--wash)}.icon-btn.round{border-radius:50%}.controls .play-main{width:64px;height:64px;min-width:64px;min-height:64px;background:var(--ink);color:var(--paper);border-radius:50%}.play-main svg{width:25px;height:25px}.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--sub)}.overline{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.7px;margin:0 0 14px}
.workspace{display:grid;grid-template-columns:228px minmax(0,1fr) 292px;max-width:1580px;min-height:calc(100vh - 116px);margin:auto}
.rail{background:var(--panel);border-inline-end:1px solid var(--line);padding:30px 18px 22px;display:flex;flex-direction:column;gap:0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:38px}
.brand-mark,.mobile-brand{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;font-weight:900;font-size:24px;position:relative;box-shadow:0 4px 14px rgba(37,99,235,0.35);user-select:none}
.brand b{font-size:17px;font-weight:900}.brand small{display:block;font:8px/1.5 sans-serif;letter-spacing:1px;margin-top:2px;color:var(--sub)}
.rail-nav{display:grid;gap:5px}.rail-nav a{height:48px;padding:0 12px;display:flex;align-items:center;gap:11px;font-weight:650;font-size:13px;border-radius:var(--r)}.rail-nav a:hover{background:var(--wash)}.rail-nav a.active{background:var(--ink);color:var(--paper)}.rail-nav .counter{margin-inline-start:auto;font-size:11px}.rail-history{margin-top:28px;border-top:1px solid var(--line);padding-top:24px}.history-link{display:flex;align-items:center;min-height:44px;width:100%;text-align:start;background:none;font-size:12px;color:var(--sub);padding:0 8px;border-radius:var(--r)}.history-link:hover{color:var(--red);background:var(--wash)}.rail-bottom{margin-top:auto;padding-top:30px;display:flex;gap:8px;align-items:center;color:var(--sub);font-size:11px}.demo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10b981;flex:none}
.content-shell{min-width:0;padding:25px 30px 0}.toolbar{display:flex;align-items:center;gap:16px}.search-field{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border-bottom:1px solid var(--muted);padding-bottom:5px}.search-field>svg{color:var(--sub)}.search-field input{min-width:0;width:100%;border:0;outline:0;background:none;height:44px;font-size:13px}.search-field:focus-within{border-color:var(--red)}.quality-chip{direction:ltr;gap:5px;background:none;padding:0 10px;font-size:12px}.quality-chip span+span{font-size:10px;color:var(--sub)}.mobile-brand{display:none}

/* سربرگ بهبودیافته و ضد شکستن کادر */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.page-head-main{min-width:0;flex:1}
.page-head h1{font-size:22px;line-height:1.45;font-weight:850;letter-spacing:-.4px;margin:2px 0 4px;word-break:break-word;overflow-wrap:anywhere}
.page-head .eyebrow{color:var(--red);font-size:11px;font-weight:800;display:block;margin-bottom:2px}
.page-head p{margin:0;font-size:12px;color:var(--sub);word-break:break-word}
.page-head .count{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:700}
.url-badge{display:inline-flex;align-items:center;gap:6px;background:var(--wash);padding:3px 8px;border-radius:4px;font-size:11px;color:var(--sub);direction:ltr;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* استایل‌های بخش استقبال صفحه اول */
.home-hero{background:linear-gradient(135deg,rgba(37,99,235,0.08),rgba(79,70,229,0.04));border:1px dashed var(--line);border-radius:var(--r);padding:24px 20px;margin-bottom:26px;text-align:center}
.home-hero h2{font-size:18px;margin:0 0 6px;font-weight:850}
.home-hero p{font-size:12.5px;color:var(--sub);margin:0 0 16px}
.quick-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick-tag{background:var(--white);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:12px;color:var(--ink);transition:all .15s}
.quick-tag:hover{border-color:var(--red);color:var(--red);background:var(--wash)}

.home-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.feature-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start}
.feature-box svg{color:var(--red);margin-top:2px}
.feature-box b{display:block;font-size:13px;margin-bottom:3px}
.feature-box small{color:var(--sub);font-size:11px;line-height:1.5;display:block}

.segmented-tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px;gap:4px;margin-bottom:20px}
.segmented-tab{flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:750;font-size:13px;border-radius:calc(var(--r) - 2px);background:transparent;color:var(--sub);transition:all .15s}
.segmented-tab.active{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}

.artist-sleeve{display:grid;grid-template-columns:minmax(0,1fr) 158px;min-height:195px;background:var(--green);color:#faf1dd;margin-bottom:22px;border-radius:var(--r);overflow:hidden}.sleeve-copy{padding:23px;display:flex;flex-direction:column;align-items:start}.sleeve-copy small{color:#e6dfcc;font-size:11px;font-weight:700}.sleeve-copy h2{font-size:26px;line-height:1.4;margin:5px 0 3px}.sleeve-copy p{font-size:12px;margin:0 0 14px;color:#e6dfcc}.sleeve-copy .btn-row{margin-top:auto}.sleeve-copy .btn{background:none;border-color:#ffffff66;color:white}.sleeve-copy .btn.primary{color:#342a19;background:var(--yellow);border-color:var(--yellow)}
.cover{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;background:var(--panel);aspect-ratio:1;flex:none;border-radius:var(--r)}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mini-cover{width:48px;height:48px;min-width:48px;border-radius:var(--r);overflow:hidden;position:relative}.mini-cover img{width:100%;height:100%;object-fit:cover}
.list-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:12px 10px;border-bottom:1px solid var(--line)}
.track-row{display:grid;grid-template-columns:36px minmax(0,1fr) 45px 132px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 3px;min-height:72px}.track-row.playing .track-title{color:var(--red)}.track-row:hover{background:var(--wash)}
.track-number{font-size:12px;color:var(--sub);text-align:center}.track-main{display:flex;gap:12px;align-items:center;min-width:0}.track-copy{min-width:0}.track-title{min-height:38px;display:flex;align-items:center;text-align:start;background:none;padding:0;font-size:13.5px;max-width:100%;font-weight:750;line-height:1.4}
.track-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.track-copy small{color:var(--sub);font-size:11px;display:block;margin-top:-6px}.track-duration{font-size:11px;color:var(--sub);direction:ltr;text-align:center}.track-actions{display:flex;gap:0}
.track-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--red);cursor:pointer;margin:0}.check-wrap{display:grid;place-items:center;width:36px;height:36px}
.collection-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);padding:10px 14px;margin-bottom:12px;border-radius:var(--r);border:1px solid var(--line)}.collection-toolbar small{color:var(--sub);margin-inline-start:auto;font-weight:750}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-title h2{margin:0;font-size:16px;font-weight:800}.section-title small{color:var(--sub);font-size:12px}.load-more{display:flex;width:100%;margin:16px 0 28px;background:none}
.settings{border-top:1px solid var(--line)}.setting{padding:20px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.setting b{font-size:14px;display:block}.setting p{font-size:12px;color:var(--sub);margin:4px 0 0;max-width:360px}.setting select{height:42px;min-width:140px;padding:0 12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.credits{display:flex;flex-wrap:wrap;gap:6px 17px;align-items:center;margin:32px 0 20px;font-size:11px;color:var(--sub)}.credits a{min-height:44px;display:flex;align-items:center;text-decoration:underline;text-underline-offset:4px}
.context{padding:30px 22px;background:var(--panel);border-inline-start:1px solid var(--line)}.context-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.context-head p{margin:0}.now-card{background:var(--white);padding:14px;box-shadow:var(--shadow);border-radius:var(--r);border:1px solid var(--line)}.now-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.now-meta b{font-size:14.5px}.now-meta small{font-size:12px;color:var(--sub);display:block}.context .controls{gap:8px}.context .controls .play-main{height:48px;width:48px;min-width:48px;min-height:48px}
.controls{display:flex;justify-content:center;align-items:center;gap:13px;direction:ltr}
.range{accent-color:var(--red);height:28px;width:100%;cursor:pointer;direction:ltr;margin:0;background:none;appearance:none;-webkit-appearance:none;outline:none}
.range::-webkit-slider-runnable-track{height:4px;border:0;border-radius:2px;background:linear-gradient(to right,var(--red) var(--fill,0%),var(--line) var(--fill,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--red);margin-top:-5px;border:0}
.seek-times{display:flex;justify-content:space-between;font-size:11px;direction:ltr;color:var(--sub);font-variant-numeric:tabular-nums}

.dock{position:fixed;inset-inline:0;bottom:0;z-index:15;min-height:96px;background:#181816;color:#f4ecdd;display:grid;grid-template-columns:minmax(160px,1fr) minmax(260px,1.4fr) minmax(130px,1fr);gap:20px;align-items:center;padding:10px max(22px,calc((100vw - 1540px)/2 + 25px));border-top:2px solid var(--red)}
.dock button{color:inherit}.dock .dock-song{display:flex;gap:12px;align-items:center;background:none;text-align:start;min-width:0;padding:0}.dock-song b{display:block;font-size:13.5px}.dock-song small{font-size:11px;color:#c1b8a8}
.dock .play-main{background:#f4ecdd;color:#181816;width:44px;height:44px;min-width:44px;min-height:44px}.dock .controls{gap:7px}
.dock-center .seek{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:8px;font-size:10px;direction:ltr;color:#c1b8a8}.dock-end{display:flex;align-items:center;justify-content:flex-end;gap:2px}.dock-end .range{max-width:75px}.dock.closed{display:none}

.sheet,.full-player{color:var(--ink);background:var(--paper);border:0;padding:0}.sheet::backdrop,.full-player::backdrop{background:#111110bb;backdrop-filter:blur(4px)}.sheet{width:min(520px,calc(100vw - 26px));max-height:85dvh;border-radius:var(--r);box-shadow:0 25px 100px #0004}.sheet-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:14px 18px;background:var(--paper)}.sheet-head h2{font-size:16px;margin:0}.sheet-body{padding:18px}.sheet-body p{color:var(--sub);font-size:13px;line-height:1.9}

/* پلیر تمام صفحه رفع باگ اسکرول در موبایل */
.full-player{width:100vw;max-width:100%;height:100dvh;max-height:100dvh;margin:0;overflow-y:auto;overflow-x:hidden}
.fp-head{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;gap:15px;border-bottom:1px solid var(--line)}
.fp-head .center{text-align:center}.fp-head small{display:block;letter-spacing:2px;font-size:10px;color:var(--red);font-weight:800}.fp-head b{font-size:13px;font-weight:600}
.fp-body{max-width:640px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
.fp-art{width:min(70vw,310px);padding:10px;background:var(--white);box-shadow:var(--shadow);border-radius:var(--r);border:1px solid var(--line)}
.fp-art .cover{width:100%;aspect-ratio:1}
.fp-info{width:100%;text-align:center}
.fp-info h1{font-size:24px;line-height:1.35;margin:10px 0 4px;word-break:break-word}
.fp-info .artist-name{font-size:14px;color:var(--sub);margin:0 0 18px}
.fp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;width:100%}

.transfer{position:fixed;z-index:40;bottom:118px;left:24px;width:min(380px,calc(100vw - 32px));background:var(--white);border:1px solid var(--line);box-shadow:0 15px 45px #0002;padding:17px;border-top:3px solid var(--red);border-radius:var(--r)}.transfer h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}.transfer p{font-size:12px;color:var(--sub);margin:7px 0}.transfer progress{accent-color:var(--red);width:100%;height:10px}
.toasts{position:fixed;z-index:100;bottom:126px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);pointer-events:none}.toast{padding:12px 18px;background:var(--ink);color:var(--paper);font-size:12.5px;box-shadow:0 6px 25px #0003;margin-top:7px;border-radius:6px}
.skeleton{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px}.skeleton i{display:block;background:var(--wash);height:42px;width:48px;border-radius:var(--r)}.skeleton span{background:var(--wash);height:14px;width:55%;border-radius:4px}
.mobile-nav{display:none}

@media(max-width:1210px){.workspace{grid-template-columns:205px minmax(0,1fr)}.context{display:none}.content-shell{padding-inline:24px}.dock{grid-template-columns:1fr 1.2fr 1fr;gap:12px}}
@media(max-width:760px){
body{padding-bottom:170px}.workspace{display:block;min-height:calc(100dvh - 170px)}.rail{display:none}.content-shell{padding:14px 14px 0}.mobile-brand{display:grid;width:42px;height:42px;font-size:20px;flex:none}.toolbar{gap:9px}.quality-chip{display:none}
.page-head{flex-direction:column;align-items:flex-start;gap:6px}
.page-head .count{align-self:flex-end;margin-top:-22px}
.track-row{grid-template-columns:30px minmax(0,1fr) 88px;gap:7px;padding:10px 0}.track-actions{width:88px}.track-actions .row-fav{display:none}.track-duration{display:none}
.dock{min-height:84px;height:84px;bottom:64px;grid-template-columns:minmax(0,1fr) auto;gap:3px;padding:9px 12px}.dock-center{grid-column:2}.dock-center .seek{display:none}.dock-end{display:none}
.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);height:64px;position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{min-height:56px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;color:var(--sub)}.mobile-nav a.active{color:var(--red)}.mobile-nav svg{width:20px;height:20px}
.transfer{bottom:164px;left:16px}.toasts{bottom:174px}
}
</style>
</head>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const CF_WORKER_URL = 'https://player.foadtoonak.workers.dev';
const DEFAULT_COVER = 'https://image.qwenlm.ai/public_source/e65c539b-21b0-4d51-a3dc-04fdb44f3766/1b687daa5-7a77-44b3-9c54-a87811103bb5.png';
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

let quality = localStorage.getItem('mosi_quality') || '128';
let theme = localStorage.getItem('mosi_theme') || 'dark';
let favorites = JSON.parse(localStorage.getItem('mosi_favs') || '[]');
let historyList = JSON.parse(localStorage.getItem('mosi_history') || '[]');

let view = 'search';
let trendingSubView = 'songs';
let searchQuery = '';
let searchResults = [];
let searchResultMeta = null;
let featuredArtist = null;
let currentItem = null;
let queue = [];
let position = 0;
let playing = false;
let volume = 1;
let selectedTracks = new Set();

let zipAbortController = null;
let transferRunning = false;

const browseState = {
  songs: { endpoint: 'mp3s', type: 'featured', items: [], page: 1, done: false },
  podcasts: { endpoint: 'podcasts', type: 'featured', items: [], page: 1, done: false }
};

const audio = new Audio();
audio.preload = 'auto';

const toFa = n => String(n).replace(/[0-9]/g, d => FA_DIGITS[d]);
const fmtTime = s => {
  if (!s || isNaN(s)) return '00:00';
  s = Math.round(s);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
};
const proxyUrl = url => {
  if (!url) return '';
  if (url.startsWith('data:') || url.startsWith('blob:')) return url;
  return `${CF_WORKER_URL}/?kind=file&url=${encodeURIComponent(url)}`;
};
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function toAbsoluteUrl(raw) {
  const trimmed = raw.trim();
  if (/^https?:\/\//i.test(trimmed)) return trimmed;
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+\//i.test(trimmed) || /^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(trimmed)) {
    return 'https://' + trimmed;
  }
  return trimmed;
}

function isShortRJLink(raw) {
  try { return /^rj\.app$/i.test(new URL(toAbsoluteUrl(raw)).hostname); } catch(e) { return false; }
}

async function resolveShortLink(raw, signal) {
  const r = await fetch(`${CF_WORKER_URL}/?kind=resolve&url=${encodeURIComponent(toAbsoluteUrl(raw))}`, { signal });
  if (!r.ok) throw new Error('باز کردن لینک کوتاه ناموفق بود.');
  const d = await r.json(); return d.url;
}

function detectRJ(raw) {
  let u; try { u = new URL(toAbsoluteUrl(raw)); } catch(e) { return null; }
  if (!/radiojavan/i.test(u.hostname)) return null;
  const p = u.pathname.toLowerCase();
  const segs = u.pathname.split('/').filter(Boolean);
  const last = segs[segs.length - 1];
  if (!last) return null;
  if (p.includes('/playlist/mp3/') || p.includes('/playlist/')) return { kind: 'playlist', id: last };
  if (p.includes('/podcast/show/') || p.includes('/podcasts/show/') || p.includes('/show/')) return { kind: 'podcast_show', id: last };
  if (p.includes('/podcast/') || p.includes('/podcasts/')) return { kind: 'podcast', id: last };
  if (p.includes('/song/') || p.includes('/mp3s/mp3/') || p.includes('/mp3/')) return { kind: 'song', id: last };
  if (p.includes('/artist/')) return { kind: 'artist', id: last };
  return null;
}

function normalizeItem(raw) {
  let perm = raw.permlink || raw.id || '';
  if (typeof perm === 'string' && perm.includes('/')) perm = perm.split('/').filter(Boolean).pop();
  if (typeof perm === 'string' && perm.startsWith('http')) perm = raw.id || '';
  const hq = raw.hq_link || (typeof raw.link === 'string' && raw.link.startsWith('http') ? raw.link : null) || raw.audio_url || null;
  let lq = raw.lq_link || (hq && hq.includes('/320/') ? hq.replace('/320/', '/128/') : hq);
  return {
    id: perm || raw.id || 'id_' + Math.random().toString(36).substring(2, 9),
    permlink: perm || null,
    title: raw.title || raw.song || raw.name || 'Untitled',
    artist: raw.podcast_artist || raw.artist || raw.artist_name || raw.date || '—',
    cover: raw.photo_player || raw.photo_large || raw.photo || raw.thumbnail || raw.thumb || DEFAULT_COVER,
    duration: raw.duration != null ? Math.round(raw.duration) : 0,
    hqUrl: hq,
    lqUrl: lq,
    audioUrl: hq || lq,
    lyric: raw.lyric || raw.lyrics || '',
    type: raw.type || (raw.podcast_artist ? 'podcast' : 'song')
  };
}

async function rjFetch(kind, id, signal) {
  const r = await fetch(`${CF_WORKER_URL}/?kind=${kind}&id=${encodeURIComponent(id)}`, { cache: 'no-store', signal });
  if (r.ok) {
    const json = await r.json();
    if (json && json.success !== false) return json;
  }
  throw new Error('دریافت اطلاعات ناموفق بود.');
}

async function searchRJ(query, signal) {
  const r = await fetch(`${CF_WORKER_URL}/?kind=search&query=${encodeURIComponent(query)}`, { signal });
  if (r.ok) return await r.json();
  return null;
}

async function fetchArtist(name, signal) {
  const r = await fetch(`${CF_WORKER_URL}/?kind=artist&query=${encodeURIComponent(name)}`, { signal });
  if (!r.ok) throw new Error('دریافت صفحه هنرمند ناموفق بود');
  const data = await r.json();
  if (!data || data.success === false) throw new Error(data?.msg || 'هنرمند یافت نشد');
  return data;
}

function getItemAudioUrl(item) {
  if (quality === '128') return item.lqUrl || item.hqUrl || item.audioUrl || null;
  return item.hqUrl || item.audioUrl || item.lqUrl || null;
}

function isFav(id) {
  return favorites.some(x => (x.permlink || x.id) === id);
}

function toggleFav(item) {
  const id = item.permlink || item.id;
  if (isFav(id)) {
    favorites = favorites.filter(x => (x.permlink || x.id) !== id);
    toast('از نشان‌شده‌ها حذف شد');
  } else {
    favorites.unshift(item);
    toast('به نشان‌شده‌ها اضافه شد');
  }
  localStorage.setItem('mosi_favs', JSON.stringify(favorites));
  renderNav();
  renderPlayer();
  if (view === 'favorites') renderMain();
}

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const metaTheme = $('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#201f1c' : '#f4f0e8');
  localStorage.setItem('mosi_theme', theme);
}

function renderNav() {
  const navs = [
    ['search', 'search', 'جستجو'],
    ['trending', 'fire', 'داغ‌ترین‌ها'],
    ['favorites', 'heart', 'نشان‌شده‌ها', favorites.length],
    ['settings', 'settings', 'تنظیمات']
  ];
  $('#railNav').innerHTML = navs.map(([v, ic, lbl, cnt]) => `
    <a href="#${v}" class="${view === v ? 'active' : ''}" aria-label="${lbl}">
      ${icon(ic)}<span>${lbl}</span>
      ${cnt !== undefined ? `<span class="counter">${toFa(cnt)}</span>` : ''}
    </a>
  `).join('');

  $('#mobileNav').innerHTML = navs.map(([v, ic, lbl]) => `
    <a href="#${v}" class="${view === v ? 'active' : ''}" aria-label="${lbl}">
      ${icon(ic)}<span>${lbl}</span>
    </a>
  `).join('');

  $('#recentQueries').innerHTML = historyList.length
    ? historyList.slice(0, 5).map(q => `<button class="history-link" data-q="${q}" aria-label="جستجوی ${q}">${q}</button>`).join('')
    : '<small class="muted">—</small>';

  $('#topQuality').textContent = quality;
}

function renderTrackRow(item, index, withCheckbox = true) {
  const isPlayingItem = currentItem && (currentItem.permlink || currentItem.id) === (item.permlink || item.id);
  const itemId = item.permlink || item.id;
  const isSelected = selectedTracks.has(itemId);
  return `
    <article class="track-row ${isPlayingItem ? 'playing' : ''}" data-idx="${index}">
      ${withCheckbox ? `
        <label class="check-wrap" aria-label="انتخاب قطعه">
          <input type="checkbox" data-cb="${itemId}" ${isSelected ? 'checked' : ''} aria-label="انتخاب قطعه ${item.title}">
        </label>
      ` : `
        <span class="track-number">${toFa(index + 1)}</span>
      `}
      <div class="track-main">
        <div class="mini-cover"><img src="${proxyUrl(item.cover)}" alt="کاور ${item.title}" loading="lazy" onerror="this.src='${DEFAULT_COVER}'"></div>
        <div class="track-copy">
          <button class="track-title" data-act="play" data-idx="${index}" aria-label="پخش ${item.title}"><span>${item.title}</span></button>
          <small>${item.artist}</small>
        </div>
      </div>
      <span class="track-duration">${fmtTime(item.duration)}</span>
      <div class="track-actions">
        <button type="button" class="icon-btn" data-act="play" data-idx="${index}" aria-label="${isPlayingItem && playing ? 'مکث' : 'پخش'} ${item.title}">
          ${icon(isPlayingItem && playing ? 'pause' : 'play')}
        </button>
        <button type="button" class="icon-btn row-fav ${isFav(itemId) ? 'active' : ''}" data-act="fav" data-idx="${index}" aria-label="نشان کردن">
          ${icon('heart')}
        </button>
        <button type="button" class="icon-btn" data-act="more" data-idx="${index}" aria-label="گزینه‌های بیشتر">
          ${icon('more')}
        </button>
      </div>
    </article>
  `;
}

// ساخت عنوان بهینه و متناسب به جای چاپ آدرس‌های طولانی
function getSearchResultHeading() {
  if (!searchQuery) {
    return { eyebrow: 'جستجو و دریافت مستقیم', title: 'کاوش آثار رادیوجوان', desc: 'نام آهنگ، هنرمند یا پیوند اختصاصی را وارد کنید' };
  }
  if (searchResultMeta) {
    return {
      eyebrow: searchResultMeta.eyebrow || 'نتیجه پیوند اختصاصی',
      title: searchResultMeta.title,
      desc: searchResultMeta.desc || 'آثار استخراج‌شده از نشانی رادیوجوان'
    };
  }
  if (/^https?:\/\//i.test(searchQuery) || searchQuery.includes('rj.app')) {
    return {
      eyebrow: 'نتیجه پردازش نشانی',
      title: 'مجموعه قطعات دریافتی',
      desc: `<span class="url-badge">${icon('link')} پیوند رادیوجوان</span>`
    };
  }
  return {
    eyebrow: 'نتایج جستجو',
    title: `آثار مرتبط با «${searchQuery}»`,
    desc: 'تک‌آهنگ‌ها، پادکست‌ها و آلبوم‌های یافت‌شده'
  };
}

async function loadHomeQuickPicks() {

      items = (await fetchBrowseData('mp3s', 'featured', 1)).map(normalizeItem);
      browseState.songs.items = items;
    }
    const sampleItems = items.slice(0, 6);
    if (sampleItems.length && $('#homeQuickPicks')) {
      $('#homeQuickPicks').innerHTML = sampleItems.map((item, idx) => renderTrackRow(item, idx, false)).join('');
    }
  } catch(e) {
    if (container) container.innerHTML = '<p class="muted" style="text-align:center;padding:12px;">پیشنهادها در دسترس نیستند</p>';
  }
}

async function fetchBrowseData(endpoint, type, page) {
  const url = `https://rj-deskcloud.com/api2/${endpoint}?url=${endpoint}&type=${type}&page=${page}&_t=${Date.now()}`;
  const r = await fetch(`${CF_WORKER_URL}/?kind=file&url=${encodeURIComponent(url)}`, { cache: 'no-store' });
  if (r.ok) {
    const d = await r.json();
    return Array.isArray(d) ? d : (d.items || d.mp3s || d.podcasts || []);
  }
  return [];
}

async function loadTrendingBrowse(key) {
  const st = browseState[key];
  if (st.done) return;
  const listEl = key === 'songs' ? $('#songsTrendingList') : $('#podcastsTrendingList');
  const btnEl = key === 'songs' ? $('#loadMoreSongsBtn') : $('#loadMorePodcastsBtn');
  const countEl = key === 'songs' ? $('#songsCountLabel') : $('#podcastsCountLabel');

  if (st.items.length === 0 && listEl) {
    listEl.innerHTML = `
      <div class="skeleton"><i></i><span></span></div>
      <div class="skeleton"><i></i><span></span></div>
    `;
  }
  try {
    const rawBatch = await fetchBrowseData(st.endpoint, st.type, st.page);
    if (!rawBatch.length) {
      st.done = true;
      if (btnEl) btnEl.style.display = 'none';
    } else {
      st.items.push(...rawBatch.map(normalizeItem));
      st.page++;
      if (listEl) listEl.innerHTML = st.items.map((item, idx) => renderTrackRow(item, idx, false)).join('');
      if (countEl) countEl.textContent = `${toFa(st.items.length)} مورد`;
    }
  } catch(e) {
    if (listEl) listEl.innerHTML = '<p class="muted" style="text-align:center;padding:16px;">خطا در دریافت لیست</p>';
  }
}

async function executeSearch(queryStr) {
  queryStr = queryStr.trim();
  if (!queryStr) return;
  searchQuery = queryStr;
  view = 'search';
  featuredArtist = null;
  searchResultMeta = null;
  selectedTracks.clear();

  if (!queryStr.startsWith('http')) {
    historyList = [queryStr, ...historyList.filter(x => x !== queryStr)].slice(0, 8);
    localStorage.setItem('mosi_history', JSON.stringify(historyList));
  }

  $('#main').innerHTML = `
    <div class="page-head"><div class="page-head-main"><h1>در حال استخراج و پردازش اطلاعات...</h1></div></div>
    <div class="skeleton"><i></i><span></span></div>
    <div class="skeleton"><i></i><span></span></div>
  `;

  try {
    let resolvedQuery = queryStr;
    if (isShortRJLink(resolvedQuery)) {
      resolvedQuery = await resolveShortLink(resolvedQuery);
    }

    const info = detectRJ(resolvedQuery);
    if (info) {
      if (info.kind === 'playlist') {
        const d = await rjFetch('playlist', info.id);
        searchResults = (d.items || d.songs || []).map(normalizeItem);
        searchResultMeta = {
          eyebrow: 'پلی‌لیست رادیوجوان',
          title: d.title || 'پلی‌لیست انتخابی',
          desc: `گردآورنده: ${d.created_by || 'رادیوجوان'}`
        };
      } else if (info.kind === 'podcast_show') {
        const d = await rjFetch('podcast', info.id);
        searchResults = (d.podcasts || d.items || []).map(normalizeItem);
        searchResultMeta = {
          eyebrow: 'مجموعه پادکست',
          title: d.title || 'قسمت‌های پادکست',
          desc: `سازنده: ${d.podcast_artist || 'رادیوجوان'}`
        };
      } else if (info.kind === 'artist') {
        const d = await fetchArtist(info.id);
        searchResults = [...(d.mp3s || []), ...(d.podcasts || [])].map(normalizeItem);
        const aName = d.name || d.query || info.id.replace(/-/g, ' ');
        featuredArtist = { name: aName, photo: d.photo || DEFAULT_COVER };
        searchResultMeta = {
          eyebrow: 'دیسکوگرافی هنرمند',
          title: `تمام آثار ${aName}`,
          desc: 'شامل تک‌آهنگ‌ها و پادکست‌های مرتبط'
        };
      } else {
        const d = await rjFetch(info.kind, info.id);
        if (d.type === 'show' || Array.isArray(d.podcasts)) {
          searchResults = (d.podcasts || []).map(normalizeItem);
          searchResultMeta = {
            eyebrow: 'پادکست اختصاصی',
            title: d.title || 'شو پادکست',
            desc: `هنرمند: ${d.podcast_artist || 'رادیوجوان'}`
          };
        } else {
          const norm = normalizeItem(d);
          searchResults = [norm];
          searchResultMeta = {
            eyebrow: 'قطعهٔ انتخابی',
            title: norm.title,
            desc: `خواننده: ${norm.artist}`
          };
        }
      }
    } else {
      const data = await searchRJ(queryStr);
      if (data) {
        if (Array.isArray(data.artists) && data.artists.length > 0) {
          featuredArtist = data.artists[0];
        } else if (Array.isArray(data.shows) && data.shows.length > 0) {
          featuredArtist = { name: data.shows[0].title, photo: data.shows[0].photo };
        }
        const rawItems = [...(data.mp3s || []), ...(data.songs || []), ...(data.podcasts || [])];
        searchResults = rawItems.map(normalizeItem);
      } else {
        searchResults = [];
      }
    }
  } catch (e) {
    searchResults = [];
    toast('خطا در برقراری ارتباط با سرور');
  }
  renderMain();
}

async function playTrack(item, newQueue = null) {
  if (newQueue) {
    queue = newQueue;
  } else if (!queue.length) {
    queue = [item];
  }

  let audioUrl = getItemAudioUrl(item);
  if (!audioUrl) {
    try {
      const raw = await rjFetch(item.type === 'podcast' ? 'podcast' : 'song', item.permlink || item.id);
      const norm = normalizeItem(raw);
      item.hqUrl = norm.hqUrl;
      item.lqUrl = norm.lqUrl;
      item.audioUrl = norm.audioUrl;
      audioUrl = getItemAudioUrl(item);
    } catch (e) {
      toast('دریافت لینک استریم ناموفق بود');
      return;
    }
  }

  currentItem = item;
  audio.src = proxyUrl(audioUrl);
  audio.volume = volume;
  audio.play().then(() => {
    playing = true;
    renderPlayer();
    renderMain();
  }).catch(() => {
    toast('خطا در پخش استریم');
  });
}

function togglePlay() {
  if (!currentItem) return;
  if (audio.paused) {
    audio.play().then(() => {
      playing = true;
      renderPlayer();
      renderMain();
    });
  } else {
    audio.pause();
    playing = false;
    renderPlayer();
    renderMain();
  }
}

function playNext() {
  if (!queue.length || !currentItem) return;
  const currIdx = queue.findIndex(x => (x.permlink || x.id) === (currentItem.permlink || currentItem.id));
  if (currIdx < queue.length - 1) {
    playTrack(queue[currIdx + 1]);
  } else {
    toast('به انتهای لیست رسیدید');
  }
}

function playPrev() {
  if (!queue.length || !currentItem) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  const currIdx = queue.findIndex(x => (x.permlink || x.id) === (currentItem.permlink || currentItem.id));
  if (currIdx > 0) {
    playTrack(queue[currIdx - 1]);
  }
}

audio.addEventListener('timeupdate', () => {
  position = Math.round(audio.currentTime);
  const dur = Math.round(audio.duration) || currentItem?.duration || 0;
  $$('[data-seek]').forEach(el => {
    el.max = dur;
    el.value = position;
    el.style.setProperty('--fill', (dur ? (position / dur * 100) : 0) + '%');
  });
  $$('[data-elapsed]').forEach(el => el.textContent = fmtTime(position));
});

audio.addEventListener('ended', playNext);

async function downloadSingle(item) {
  toast('در حال آماده‌سازی دریافت فایل...');
  let dlUrl = getItemAudioUrl(item);
  if (!dlUrl) {
    try {
      const raw = await rjFetch(item.type === 'podcast' ? 'podcast' : 'song', item.permlink || item.id);
      const norm = normalizeItem(raw);
      dlUrl = quality === '128' ? (norm.lqUrl || norm.hqUrl) : (norm.hqUrl || norm.lqUrl);
    } catch (e) {
      toast('پیوند دریافت فایل پیدا نشد');
      return;
    }
  }

  try {
    const res = await fetch(proxyUrl(dlUrl));
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `${item.artist} - ${item.title} (${quality}kbps).mp3`.replace(/[\\/:*?"<>|]/g, '');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
    toast('دانلود فایل آغاز شد');
  } catch (e) {
    toast('خطا در دریافت مستقیم فایل');
  }
}

async function downloadZipCollection(items) {
  if (!items.length) {
    toast('هیچ موردی انتخاب نشده است');
    return;
  }
  if (transferRunning) {
    toast('یک دانلود گروهی دیگر در حال اجراست');
    return;
  }

  transferRunning = true;
  zipAbortController = new AbortController();
  const { signal } = zipAbortController;

  const transferEl = $('#transfer');
  transferEl.hidden = false;

  let zip = new JSZip();
  let done = 0;
  let part = 1;
  let totalBytesInPart = 0;
  const PART_LIMIT_BYTES = 120 * 1024 * 1024;

  const updateProgressUI = () => {
    const pct = Math.round((done / items.length) * 100);
    transferEl.innerHTML = `
      <h3>
        <span>در حال آماده‌سازی ZIP (پارت ${toFa(part)})</span>
        <button class="icon-btn" id="cancelZipBtn" aria-label="لغو عملیات دانلود">${icon('close')}</button>
      </h3>
      <p>دریافت قطعات: ${toFa(done)} از ${toFa(items.length)} (${toFa(pct)}%)</p>
      <progress value="${pct}" max="100"></progress>
    `;
    const cBtn = $('#cancelZipBtn');
    if (cBtn) {
      cBtn.onclick = () => {
        if (zipAbortController) zipAbortController.abort();
      };
    }
  };

  updateProgressUI();

  try {
    for (const item of items) {
      if (signal.aborted) throw new Error('ABORTED');

      let dlUrl = getItemAudioUrl(item);
      if (!dlUrl) {
        try {
          const raw = await rjFetch(item.type === 'podcast' ? 'podcast' : 'song', item.permlink || item.id, signal);
          const norm = normalizeItem(raw);
          dlUrl = quality === '128' ? (norm.lqUrl || norm.hqUrl) : (norm.hqUrl || norm.lqUrl);
        } catch (err) {}
      }

      if (dlUrl) {
        try {
          const r = await fetch(proxyUrl(dlUrl), { signal });
          if (r.ok) {
            const blob = await r.blob();
            const fileName = `${item.artist} - ${item.title}.mp3`.replace(/[\\/:*?"<>|]/g, '');
            zip.file(fileName, blob);
            totalBytesInPart += blob.size;

            if (totalBytesInPart >= PART_LIMIT_BYTES && done < items.length - 1) {
              toast(`تکمیل پارت ${toFa(part)}؛ در حال ذخیره روی حافظه...`);
              const partBlob = await zip.generateAsync({ type: 'blob' });
              const partUrl = URL.createObjectURL(partBlob);
              const a = document.createElement('a');
              a.href = partUrl;
              a.download = `RadioJavan_Collection_Part${part}_${Date.now()}.zip`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(partUrl), 1500);

              zip = new JSZip();
              totalBytesInPart = 0;
              part++;
            }
          }
        } catch (err) {
          if (signal.aborted) throw new Error('ABORTED');
        }
      }

      done++;
      updateProgressUI();
    }

    if (signal.aborted) throw new Error('ABORTED');

    toast('در حال ساخت فایل فشرده نهایی...');
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const zipUrl = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = zipUrl;
    a.download = part > 1 ? `RadioJavan_Collection_Part${part}_${Date.now()}.zip` : `RadioJavan_Collection_${Date.now()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(zipUrl), 1500);

    toast('دانلود مجموعه فشرده پایان یافت');
  } catch (err) {
    if (err.message === 'ABORTED' || signal.aborted) {
      toast('دانلود با موفقیت لغو شد و حافظه آزاد گردید.');
    } else {
      toast('خطا در فشرده‌سازی و دانلود فایل‌ها');
    }
  } finally {
    zip = null;
    transferRunning = false;
    zipAbortController = null;
    transferEl.hidden = true;
  }
}

async function showLyrics(item) {
  $('#sheet').innerHTML = `
    <div class="sheet-head">
      <h2>متن ترانه: ${item.title}</h2>
      <button class="icon-btn" id="closeSheetBtn" aria-label="بستن">${icon('close')}</button>
    </div>
    <div class="sheet-body"><p style="text-align:center;">در حال دریافت متن ترانه...</p></div>
  `;
  $('#sheet').showModal();

  let text = item.lyric;
  if (!text) {
    try {
      const raw = await rjFetch(item.type === 'podcast' ? 'podcast' : 'song', item.permlink || item.id);
      text = raw.lyric || raw.lyrics || '';
    } catch (e) {}
  }

  $('#sheet').querySelector('.sheet-body').innerHTML = text
    ? `<div style="white-space:pre-line;text-align:center;line-height:2.2;font-size:15.5px;">${text}</div>`
    : `<p style="text-align:center;padding:20px;">متن ترانه‌ای برای این اثر یافت نشد.</p>`;
}

$('#searchForm').onsubmit = e => {
  e.preventDefault();
  executeSearch($('#query').value);
};

$('#clearBtn').onclick = () => {
  $('#query').value = '';
  $('#query').focus();
};

$('#topQualityBtn').onclick = () => {
  quality = quality === '320' ? '128' : '320';
  localStorage.setItem('mosi_quality', quality);
  $('#topQuality').textContent = quality;
  toast(`کیفیت روی ${quality} kbps تنظیم شد`);
};

window.addEventListener('hashchange', () => {
  const hash = location.hash.slice(1) || 'search';
  if (['search', 'trending', 'favorites', 'settings'].includes(hash)) {
    view = hash;
    renderMain();
  }
});

document.addEventListener('click', e => {
  const qBtn = e.target.closest('[data-q]');
  if (qBtn) {
    $('#query').value = qBtn.dataset.q;
    executeSearch(qBtn.dataset.q);
    return;
  }

  if (e.target.closest('#tabSongsBtn')) {
    trendingSubView = 'songs';
    renderMain();
    return;
  }
  if (e.target.closest('#tabPodcastsBtn')) {
    trendingSubView = 'podcasts';
    renderMain();
    return;
  }

  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    const act = actBtn.dataset.act;
    const idx = parseInt(actBtn.dataset.idx, 10);
    let list = searchResults;
    if (view === 'favorites') list = favorites;
    else if (view === 'trending') list = browseState[trendingSubView].items;
    else if (view === 'search' && !searchResults.length) list = browseState.songs.items;
    const item = list[idx];

    if (act === 'play' && item) {
      if (currentItem && (currentItem.permlink || currentItem.id) === (item.permlink || item.id)) {
        togglePlay();
      } else {
        playTrack(item, list);
      }
    } else if (act === 'fav' && item) {
      toggleFav(item);
    } else if (act === 'more' && item) {
      $('#sheet').innerHTML = `
        <div class="sheet-head"><h2>${item.title}</h2><button class="icon-btn" id="closeSheetBtn" aria-label="بستن">${icon('close')}</button></div>
        <div class="sheet-body">
          <button class="btn" style="width:100%;margin-bottom:8px;" id="menuDl" aria-label="دانلود فایل">${icon('download')} دانلود فایل</button>
          <button class="btn" style="width:100%;margin-bottom:8px;" id="menuLyrics" aria-label="مشاهده متن ترانه">${icon('lyrics')} متن ترانه</button>
          <button class="btn" style="width:100%;" id="menuCopy" aria-label="کپی لینک مستقیم">${icon('link')} کپی لینک مستقیم</button>
        </div>
      `;
      $('#sheet').showModal();
      $('#menuDl').onclick = () => { $('#sheet').close(); downloadSingle(item); };
      $('#menuLyrics').onclick = () => { $('#sheet').close(); showLyrics(item); };
      $('#menuCopy').onclick = () => {
        $('#sheet').close();
        const lk = getItemAudioUrl(item);
        if (lk) {
          navigator.clipboard.writeText(proxyUrl(lk));
          toast('لینک مستقیم کپی شد');
        }
      };
    }
  }

  if (e.target.closest('#dockPlay') || e.target.closest('#ctxPlay') || e.target.closest('#fpPlay')) togglePlay();
  if (e.target.closest('#dockNext') || e.target.closest('#ctxNext') || e.target.closest('#fpNext')) playNext();
  if (e.target.closest('#dockPrev') || e.target.closest('#ctxPrev') || e.target.closest('#fpPrev')) playPrev();

  if (e.target.closest('#ctxFavBtn') || e.target.closest('#fpFav')) {
    if (currentItem) toggleFav(currentItem);
  }

  if (e.target.closest('#loadMoreSongsBtn')) loadTrendingBrowse('songs');
  if (e.target.closest('#loadMorePodcastsBtn')) loadTrendingBrowse('podcasts');

  if (e.target.closest('#openArtistDiscographyBtn') && featuredArtist) {
    const artistTarget = featuredArtist.query || featuredArtist.name;
    $('#query').value = artistTarget;
    executeSearch(`https://play.radiojavan.com/artist/${artistTarget}`);
  }

  if (e.target.closest('#searchSelectAllBtn')) {
    selectedTracks = new Set(searchResults.map(x => x.permlink || x.id));
    renderMain();
  }
  if (e.target.closest('#searchSelectNoneBtn')) {
    selectedTracks.clear();
    renderMain();
  }
  if (e.target.closest('#searchZipBtn')) {
    const listToZip = searchResults.filter(x => selectedTracks.has(x.permlink || x.id));
    downloadZipCollection(listToZip.length ? listToZip : searchResults);
  }

  if (e.target.closest('#favSelectAllBtn')) {
    selectedTracks = new Set(favorites.map(x => x.permlink || x.id));
    renderMain();
  }
  if (e.target.closest('#favSelectNoneBtn')) {
    selectedTracks.clear();
    renderMain();
  }
  if (e.target.closest('#favZipBtn')) {
    const listToZip = favorites.filter(x => selectedTracks.has(x.permlink || x.id));
    downloadZipCollection(listToZip.length ? listToZip : favorites);
  }

  if (e.target.closest('#openFullDock') || e.target.closest('#dockExpand')) {
    $('#fullPlayer').showModal();
    renderFullPlayer();
  }
  if (e.target.closest('#fpClose')) $('#fullPlayer').close();
  if (e.target.closest('#closeSheetBtn')) $('#sheet').close();

  if (e.target.closest('#fpDlBtn')) { if (currentItem) downloadSingle(currentItem); }
  if (e.target.closest('#fpLyricsBtn')) { if (currentItem) showLyrics(currentItem); }
  if (e.target.closest('#fpCopyBtn')) {
    if (currentItem) {
      const url = getItemAudioUrl(currentItem);
      if (url) {
        navigator.clipboard.writeText(proxyUrl(url));
        toast('لینک مستقیم کپی شد');
      }
    }
  }

  if (e.target.closest('#dockMute')) {
    volume = volume > 0 ? 0 : 1;
    audio.volume = volume;
    renderPlayer();
  }

  if (e.target.closest('#clearHistoryBtn')) {
    historyList = [];
    localStorage.removeItem('mosi_history');
    toast('تاریخچه جستجو پاک شد');
    renderNav();
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.cb) {
    const id = e.target.dataset.cb;
    if (e.target.checked) selectedTracks.add(id);
    else selectedTracks.delete(id);
    const countEl = $('#selectedCount');
    if (countEl) countEl.textContent = `${toFa(selectedTracks.size)} مورد انتخاب‌شده`;
  }
  if (e.target.id === 'cfgQuality') {
    quality = e.target.value;
    localStorage.setItem('mosi_quality', quality);
    $('#topQuality').textContent = quality;
    toast(`کیفیت روی ${quality} kbps تنظیم شد`);
  }
  if (e.target.id === 'cfgTheme') {
    theme = e.target.value;
    applyTheme();
    toast('پوسته تغییر یافت');
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-seek]')) {
    audio.currentTime = Number(e.target.value);
  }
  if (e.target.id === 'dockVol') {
    volume = parseFloat(e.target.value);
    audio.volume = volume;
  }
});

applyTheme();
renderNav();
renderMain();
</script>
</body>
</html>
